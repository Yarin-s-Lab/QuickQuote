name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # PDF/PNG tests skip here (no Pango on the runner); they run in the docker job.
      - run: pytest -ra

  frontend:
    name: Frontend — lint + tests + build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker — images, full suite + snapshots, smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build both images
        run: docker compose build

      - name: Full backend suite inside the image (PDF + PNG snapshot, no skips allowed)
        run: |
          set -o pipefail  # without it `| tee` would hide a failing pytest
          mkdir -p snapshot-failures && chmod 777 snapshot-failures
          docker compose run --rm --no-deps \
            -e SNAPSHOT_FAILURES_DIR=/failures \
            -v "$PWD/snapshot-failures:/failures" \
            backend pytest -ra -p no:cacheprovider | tee pytest.log
          if grep -qE '^SKIPPED' pytest.log; then
            echo "::error::Tests were skipped inside the image; PDF/snapshot tests must run here."
            exit 1
          fi

      - name: Smoke test through nginx (create, download, bad token)
        run: |
          set -euo pipefail
          docker compose up -d --wait
          cat > body.json <<'JSON'
          {"product": "car",
           "inputs": {"driver_age": 35, "license_years": 10, "car_value": 120000,
                      "claims_last_3_years": 0, "coverage_type": "comprehensive"},
           "coverages": ["towing"],
           "agent_name": "דנה כהן", "client_full_name": "ישראל ישראלי"}
          JSON
          resp=$(curl -fsS -X POST localhost:8080/api/quotes \
            -H 'Content-Type: application/json' --data-binary @body.json)
          echo "$resp"
          number=$(echo "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["quote_number"])')
          url=$(echo "$resp" | python3 -c 'import json,sys; print(json.load(sys.stdin)["download_url"])')

          curl -fsS -D headers.txt -o quote.pdf "http://localhost:8080${url}"
          head -c 5 quote.pdf | grep -q '%PDF-'
          grep -qi "content-disposition: attachment; filename=\"${number}.pdf\"" headers.txt
          grep -qi 'content-type: application/pdf' headers.txt
          # Exactly one Referrer-Policy (no-referrer from the backend; nginx must not add a second).
          test "$(grep -ci '^referrer-policy:' headers.txt)" = 1
          grep -qi '^referrer-policy: no-referrer' headers.txt

          # Second download with the same link works.
          curl -fsS -o /dev/null "http://localhost:8080${url}"

          # Unknown token and traversal attempt are 404.
          bad=$(printf 'A%.0s' $(seq 43))
          test "$(curl -s -o /dev/null -w '%{http_code}' "localhost:8080/api/quotes/download/${bad}")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' --path-as-is "localhost:8080/api/quotes/download/..%2F..%2Fetc%2Fpasswd")" = 404
          # Comparison: a second car quote, compare both, response must be a PDF.
          sed 's/"driver_age": 35/"driver_age": 23/' body.json > body2.json
          resp2=$(curl -fsS -X POST localhost:8080/api/quotes \
            -H 'Content-Type: application/json' --data-binary @body2.json)
          number2=$(echo "$resp2" | python3 -c 'import json,sys; print(json.load(sys.stdin)["quote_number"])')
          token1=${url##*/}
          token2=$(echo "$resp2" | python3 -c 'import json,sys; print(json.load(sys.stdin)["download_url"].rsplit("/",1)[1])')
          curl -fsS -D cmp-headers.txt -o compare.pdf -X POST localhost:8080/api/quotes/compare \
            -H 'Content-Type: application/json' \
            --data "{\"tokens\": [\"${token1}\", \"${token2}\"]}"
          head -c 5 compare.pdf | grep -q '%PDF-'
          grep -qi 'content-type: application/pdf' cmp-headers.txt
          grep -qi "filename=\"compare-${number}-${number2}.pdf\"" cmp-headers.txt
          test "$(grep -ci '^referrer-policy:' cmp-headers.txt)" = 1

          # Car vs apartment cannot be compared -> 422.
          cat > apt.json <<'JSON'
          {"product": "apartment",
           "inputs": {"structure_value": 1000000, "contents_value": 0, "floor": 2, "has_alarm": false},
           "coverages": [], "agent_name": "דנה כהן", "client_full_name": "ישראל ישראלי"}
          JSON
          token3=$(curl -fsS -X POST localhost:8080/api/quotes -H 'Content-Type: application/json' \
            --data-binary @apt.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["download_url"].rsplit("/",1)[1])')
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/quotes/compare \
            -H 'Content-Type: application/json' --data "{\"tokens\": [\"${token1}\", \"${token3}\"]}")" = 422

          # Raw ../ is normalised by nginx to /etc/passwd -> SPA index.html; never the file itself.
          ! curl -s --path-as-is "localhost:8080/api/quotes/download/../../../etc/passwd" | grep -q 'root:'

      - name: Container logs
        if: failure()
        run: docker compose logs

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures
          path: snapshot-failures/
          if-no-files-found: ignore

      - name: Stop
        if: always()
        run: docker compose down -v
