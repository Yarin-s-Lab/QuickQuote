server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin API: the browser only talks to this server.
    # Security headers for API responses come from the backend only. Adding them here
    # too would send duplicates; for the PDF download that means two Referrer-Policy
    # values, and a browser may pick "same-origin" over the backend's "no-referrer".
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 64k;
    }

    # Static frontend (SPA fallback to index.html).
    location / {
        try_files $uri /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
}
